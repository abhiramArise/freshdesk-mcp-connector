[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "freshdesk-readonly-mcp"
version = "0.1.0"
description = "Read-only Freshdesk MCP server"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1", "mcp>=1.30,<2", "jsonschema>=4.20,<5", "pydantic>=2.11,<3"]

[project.scripts]
freshdesk-mcp = "freshdesk_mcp.server:main"

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2"]

[tool.hatch.build.targets.wheel]
packages = ["src/freshdesk_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
